name: mhka

on:
  push:
    branches: ['**']
    paths: ['mhka/**', '.github/workflows/mhka.yml']
  pull_request:
    paths: ['mhka/**', '.github/workflows/mhka.yml']

defaults:
  run:
    working-directory: mhka

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mhka/package-lock.json
      - run: npm ci

      - name: Build
        run: npm run build

      # 82 tests, including the assertion that no Notion write method is
      # reachable from the built bundle and that no --fix/--force flag exists.
      - name: Tests
        run: npm test

      # Smoke test, not a gate.
      #
      # This proves the rules execute against real corpus data without
      # crashing — a rule that throws on real input is a bug in the tool and
      # `runRules` turns that into an error-severity finding, so a crash still
      # shows up here.
      #
      # It deliberately does NOT fail on corpus findings. mhka audits a living
      # Notion base that an agent writes to every morning; findings are its
      # normal output, not a broken build. Gating on them turns every unrelated
      # PR red — a dependency bump cannot fix an unverified archival reference
      # — and a check that is red for reasons the author cannot act on is a
      # check people learn to ignore. The corpus findings belong in the report
      # a human reads, which is what `mhka report --markdown` is for.
      - name: Smoke-test the rules against the committed snapshot
        run: node dist/cli.js validate --exit-zero

      # Surface the findings in the run summary so they are visible without
      # being blocking. `report` gates on findings too, so it needs the same
      # flag — the step runs under `bash -e` and would otherwise fail the job
      # for exactly the reason the step above stopped failing it.
      - name: Findings summary
        if: always()
        run: node dist/cli.js report --markdown --exit-zero >> "$GITHUB_STEP_SUMMARY"
